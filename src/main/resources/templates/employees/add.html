<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm nhân viên mới - Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/employees/list">Employee System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/employees/list">Danh sách</a></li>
                <li class="nav-item"><a class="nav-link active" href="/employees/add">Thêm nhân viên</a></li>
                <li class="nav-item"><a class="nav-link" href="/employees/search">Tìm kiếm</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h4 class="mb-0">Thêm nhân viên mới</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/employees/add}" th:object="${employee}" method="post">
                <div class="mb-3">
                    <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{name}" placeholder="Nhập họ và tên...">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="example@email.com">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phòng ban</label>
                    <select class="form-select" th:field="*{departmentId}">
                        <option value="">-- Chọn phòng ban --</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mức lương (VND) <span class="text-danger">*</span></label>
                    <input type="number" step="100000" class="form-control" th:field="*{salary}" placeholder="15000000">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/employees/list" class="btn btn-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Lưu nhân viên</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
