<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tìm kiếm nhân viên - Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/employees/list">Employee System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/employees/list">Danh sách</a></li>
                <li class="nav-item"><a class="nav-link" href="/employees/add">Thêm nhân viên</a></li>
                <li class="nav-item"><a class="nav-link active" href="/employees/search">Tìm kiếm</a></li>
                <li class="nav-item"><a class="nav-link" href="/employees/statistics">Thống kê</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="mb-3">Tìm kiếm nhân viên theo tên hoặc phòng ban</h4>
            <form th:action="@{/employees/search}" method="get" class="row g-2">
                <div class="col-md-9">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên nhân viên hoặc tên phòng ban...">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Kết quả tìm kiếm</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Phòng ban</th>
                    <th>Lương (VND)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${results}">
                    <td th:text="${emp.id}">1</td>
                    <td class="fw-semibold" th:text="${emp.name}">Nguyen Van A</td>
                    <td th:text="${emp.email}">a@example.com</td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${emp.department != null ? emp.department.name : 'Chưa phân bổ'}">IT</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(emp.salary, 0, 'COMMA', 0, 'POINT')} + ' đ'">15,000,000 đ</td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}">
                    <td colspan="5" class="text-center py-4 text-muted">Không tìm thấy nhân viên nào phù hợp.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
