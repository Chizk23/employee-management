<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách nhân viên - Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/employees/list">Employee System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/employees/list">Danh sách</a></li>
                <li class="nav-item"><a class="nav-link" href="/employees/add">Thêm nhân viên</a></li>
                <li class="nav-item"><a class="nav-link" href="/employees/search">Tìm kiếm</a></li>
                <li class="nav-item"><a class="nav-link" href="/employees/statistics">Thống kê</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh sách nhân viên</h2>
        <a href="/employees/add" class="btn btn-success">+ Thêm nhân viên mới</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Phòng ban</th>
                    <th>Lương (VND)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}">1</td>
                    <td class="fw-semibold" th:text="${emp.name}">Nguyen Van A</td>
                    <td th:text="${emp.email}">a@example.com</td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${emp.department != null ? emp.department.name : 'Chưa phân bổ'}">IT</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(emp.salary, 0, 'COMMA', 0, 'POINT')} + ' đ'">15,000,000 đ</td>
                </tr>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="5" class="text-center py-4 text-muted">Chưa có nhân viên nào trong hệ thống.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
