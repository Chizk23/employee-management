spring:
  application:
    name: employee-management
  profiles:
    active: dev
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=60s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
